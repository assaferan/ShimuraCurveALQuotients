name: tests

# Topic branches are tested by their PR only.  With `push: ['**']` every push to a topic branch
# started TWO full matrices (event=push and event=pull_request_target, seconds apart) -- on #48
# that was two identical 103-job runs.  Pushes to the two long-lived branches still run directly.
on:
  push:
    branches: [ main, m0-theta-campaign ]

  # `pull_request`, not `pull_request_target`: the latter checked out the PR head and executed it
  # with the base repo's secrets.  `pull_request` runs on the merge ref, and a fork PR gets no
  # secrets at all (has_access is then false and the matrix does not run).
  pull_request:

# A new push to the same PR or branch supersedes the run in flight instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v2

      - id: set-matrix
        run: |
          # Files starting with _ are helpers, not test targets.  run_filters.m is the full
          # end-to-end pipeline (runs for 6h+, exceeding GitHub's hard 6h job limit); it is meant
          # to be run locally / on a large machine, so it is excluded from the CI matrix.
          matrix=$((
            echo '{ "target" : ['
            ls -1 tests | grep -vE '^_|^run_filters\.m$' | sed -r 's/^([^,]*)(,?)$/"\1"\2/'  | paste -sd "," -
            echo " ]}"
          ) | jq -c .)
          echo $matrix
          echo $matrix | jq .
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  check-matrix:
    runs-on: ubuntu-latest
    needs: matrix
    steps:
      - name: Install json2yaml
        run: |
          sudo npm install -g json2yaml

      - name: Check matrix definition
        run: |
          matrix='${{needs.matrix.outputs.matrix}}'
          echo $matrix
          echo $matrix | jq .
          echo $matrix | json2yaml

  has_access:
    runs-on: ubuntu-latest
    outputs:
      has_access: ${{ steps.my-key.outputs.has_access }}

    steps:
      - id: my-key
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        if: "${{ env.MAGMA_URL != '' }}"
        run: |
          echo "has_access=true" >> $GITHUB_OUTPUT

  check-has_access:
    runs-on: ubuntu-latest
    needs: has_access
    steps:
      - name: Check has_access definition
        run: |
          echo ${{needs.has_access.outputs.has_access}}



  printjob:
    name: print event
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: dump github context
        env:
          github_context: ${{ tojson(github) }}
        run: |
          echo "$github_context"



  # Check the actor's write permission ONCE, before the matrix fans out.
  #
  # WHY: this check used to run INSIDE every one of the ~40 matrix jobs, each firing its own
  # authenticated API call.  A single transient failure makes that job print "Sorry! Your
  # permissions are insufficient." and run `false`, reddening the entire run -- indistinguishable
  # from a real test failure.  That happened on 2026-09-13 (X0_14_3), where every other job in the
  # same run passed the identical gate.
  #
  # This is the same lesson prime-magma below already records for the magma download: do the
  # shared, flaky, external call ONCE rather than 40 times in parallel.
  #
  # Since the trigger moved from pull_request_target to pull_request, a fork PR never sees the
  # secrets in the first place, so this gate is no longer what protects them.  It is kept because
  # it FAILS LOUDLY when permission is absent (the run goes red, never silently green), and `test`
  # needs: it -- so the matrix cannot run unless it passed.
  permission-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check user permission
        id: check
        uses: scherermichael-oss/action-has-permission@master
        with:
          required-permission: write
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop workflow for users with no write access
        if: "! steps.check.outputs.has-permission"
        run: |
          echo "Sorry! Your permissions are insufficient."
          false

      - name: The user has write access
        if: "steps.check.outputs.has-permission"
        run: |
          echo "The user has write access"

  # Download magma ONCE and populate the shared cache before the test matrix fans out.
  # On a cold cache (evicted after 7 days idle) the ~40 matrix jobs used to each fire the
  # same authenticated wget at the licence server in parallel; the server throttles/drops
  # the connections, wget stalls and eventually fails (exit 4) -- skipping the tests.
  # Priming once means every matrix job below restores a warm cache instead.
  prime-magma:
    runs-on: ubuntu-latest
    needs: has_access
    if: needs.has_access.outputs.has_access == 'true'
    steps:
      - name: Cache magma
        uses: actions/cache@v3
        id: magmacache
        env:
          # Keep in sync with the CACHE_NUMBER in the test job below.
          CACHE_NUMBER: 2.29-4
        with:
          path: |
            ./magma
          key:
            ${{ env.CACHE_NUMBER }}

      - name: Install magma
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
          MAGMA_USERNAME: ${{ secrets.MAGMA_USERNAME }}
          MAGMA_PASSWORD: ${{ secrets.MAGMA_PASSWORD }}
        shell: bash
        if: steps.magmacache.outputs.cache-hit != 'true'
        run: |
          # Resilient single download: bounded timeout so a stalled connection fails fast
          # instead of hanging (previously ~47 min), with a few backoff retries.  --no-verbose
          # (not --quiet) keeps the actual wget error in the log for diagnosis.
          for attempt in 1 2 3 4 5; do
            if wget "$MAGMA_URL" -O magma.tar.gz \
                 --user="$MAGMA_USERNAME" --password="$MAGMA_PASSWORD" \
                 --timeout=120 --tries=3 --waitretry=30 --retry-connrefused --no-verbose; then
              if tar xf magma.tar.gz; then break; fi
            fi
            echo "::warning::magma download/extract attempt $attempt failed; backing off $((attempt*30))s"
            rm -f magma.tar.gz
            sleep $((attempt * 30))
          done
          test -x ./magma/magma

  test:
    runs-on: ubuntu-latest
    name: Run tests
    # The longest jobs run ~90 min (X0_10_23 92m, X0_6_37 84m, ExternalCMValues 84m), so 180
    # leaves ~2x headroom while bounding a hang: without it a stuck job burns GitHub's full 6h
    # limit before anyone learns anything.
    # ⚠ THIS DOES NOT FIX RUNNER LOSS.  "The hosted runner lost communication with the server"
    # (X0_6_37, 2026-09-14) kills the job from outside; nothing inside the job can retry it, and
    # GitHub Actions has no per-job retry.  The only real mitigations are re-running the failed
    # job, or making those three jobs shorter.  Recorded so the next person does not go looking
    # for a retry knob that does not exist.
    timeout-minutes: 180
    needs: [has_access, matrix, prime-magma, permission-gate]
    if: needs.has_access.outputs.has_access == 'true'

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix.outputs.matrix)}}

    steps:
      # Permission is checked ONCE in the permission-gate job above, which this job needs:.
      # On a PR event this checks out the merge ref, i.e. the PR as it would land on its base.
      - name: Checkout
        uses: actions/checkout@v2

      - name: Cache magma
        uses: actions/cache@v3
        id: magmacache
        env:
          # Increase this value to reset cache when MAGMA_URL changes
          CACHE_NUMBER: 2.29-4
        with:
          path: |
            ./magma
          key:
            ${{ env.CACHE_NUMBER }}

      - name: Install magma
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
          MAGMA_USERNAME: ${{ secrets.MAGMA_USERNAME }}
          MAGMA_PASSWORD: ${{ secrets.MAGMA_PASSWORD }}
        shell: bash
        if: steps.magmacache.outputs.cache-hit != 'true'
        run: |
          # Fallback: normally skipped because prime-magma warmed the cache.  Same resilient
          # download in case a cache restore ever misses.
          for attempt in 1 2 3 4 5; do
            if wget "$MAGMA_URL" -O magma.tar.gz \
                 --user="$MAGMA_USERNAME" --password="$MAGMA_PASSWORD" \
                 --timeout=120 --tries=3 --waitretry=30 --retry-connrefused --no-verbose; then
              if tar xf magma.tar.gz; then break; fi
            fi
            echo "::warning::magma download/extract attempt $attempt failed; backing off $((attempt*30))s"
            rm -f magma.tar.gz
            sleep $((attempt * 30))
          done
          test -x ./magma/magma

      - name: Create dummy network device
        shell: bash
        run: |
          sudo ip link add dumdum type dummy
          sudo ifconfig dumdum hw ether `./magma/magma -d | grep "Valid MAC addresses" -A1 | tail -n1`
          echo | ./magma/magma

      # Normaliz is REQUIRED for any polytope solve.  Without NORMALIZ_BIN a fresh solve fails
      # SILENTLY -- "no solutions" instead of an error (see CLAUDE.md) -- so tests needing a solve
      # beyond the committed cache quietly verify less than they appear to.  That is not
      # hypothetical: X0_10_19 passed green in CI for a long time while making ZERO comparisons,
      # and was only caught once test_AllEquationsAboveCoversSingleCurve started counting them.
      # Package name checked against the same image CI runs (Ubuntu 24.04): normaliz-bin ->
      # /usr/bin/normaliz.
      # ⚠ Deliberately NOT fatal.  If the package ever disappears or is renamed, the right outcome
      # is a loud warning and a CI run that behaves as it did before -- not every job in the matrix
      # failing on a packaging change.  The warning is the signal to fix it.
      - name: Install Normaliz
        shell: bash
        run: |
          if sudo apt-get update -qq && \
             sudo apt-get install -y --no-install-recommends normaliz-bin; then
            NB="$(command -v normaliz || true)"
            if [ -x "$NB" ]; then
              echo "NORMALIZ_BIN=$NB" >> "$GITHUB_ENV"
              echo "using $NB ($("$NB" --version 2>&1 | head -1))"
            else
              echo "::warning::normaliz-bin installed but no normaliz binary found; polytope solves will fail SILENTLY"
            fi
          else
            echo "::warning::could not install normaliz-bin; polytope solves will fail SILENTLY (see CLAUDE.md)"
          fi

      - name: Run tests
        shell: bash
        run: |
          echo "NORMALIZ_BIN=${NORMALIZ_BIN:-<unset -- solves will fail silently>}"
          ./magma/magma -b verbose:=3 target:=${{matrix.target}} exitsignal:="" run_tests.m

